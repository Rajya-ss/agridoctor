plugins { id "com.android.application" }

dependencies { implementation "androidx.core:core:1.13.1" }

android {
    namespace "com.agridoctor.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.agridoctor.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // The web app (index.html, model.onnx, ort/...) is packed straight into the APK.
    sourceSets { main { assets.srcDirs = ["${rootDir}/../offline_app"] } }
    aaptOptions { noCompress "onnx", "wasm", "json" }
}
